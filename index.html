<!DOCTYPE html>
<html lang="tr">
<head>

<meta name="mobile-web-app-capable" content="yes">

<body>
<main id="screens">
  <section class="screen active" id="screen-bugun"></section>
  <section class="screen" id="screen-vardiya"></section>
  <section class="screen" id="screen-mola"></section>
  <section class="screen" id="screen-ayarlar"></section>
</main>

<nav class="tabbar" id="tabbar" aria-label="Sekmeler">
  <button data-screen="bugun" aria-label="Bugün" class="active"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Bugün</span></button>
  <button data-screen="vardiya" aria-label="Vardiya"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="4.5" width="18" height="16.5" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg><span>Vardiya</span></button>
  <button data-screen="mola" aria-label="Mola"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 9h13v5a6 6 0 0 1-6 6h-1a6 6 0 0 1-6-6z"/><path d="M17 10h1.5a2.5 2.5 0 0 1 0 5H17M8 2.5c-.8 1 .8 2 0 3.5M12 2.5c-.8 1 .8 2 0 3.5"/></svg><span>Mola</span></button>
  <button data-screen="ayarlar" aria-label="Ayarlar"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>Ayarlar</span></button>
</nav>

<div class="sheet-backdrop" id="sheet-backdrop"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="sheet-grabber" aria-hidden="true"></div><div id="sheet-body"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
<script>App.boot();</script>
</body>
</html>
